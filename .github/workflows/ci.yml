# PR のテスト。Secrets は使わない（フォークからの PR でも安全に動く）
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: 型チェック・テスト・ビルド
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json # volta.node を読む
          cache: npm

      # --ignore-scripts：インストール時のスクリプトを動かさない（ffmpeg 本体のダウンロードも省ける）
      - run: npm ci --ignore-scripts

      - name: 型チェック
        run: npm run check

      - name: テスト（単体・ビルド）
        run: npm test

      - name: 本番ビルドの検査
        run: |
          npm run build
          node scripts/verify-dist.mjs production

      - name: プレビュービルドの検査
        run: |
          npm run build:preview
          node scripts/verify-dist.mjs preview
