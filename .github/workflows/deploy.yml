# 本番デプロイ。
# - main へのマージ（push）で動く
# - 予約公開の定時実行（scheduled.yml）から呼ばれる（workflow_call）
# - 手動実行（workflow_dispatch）もできるが、main 以外のブランチからは動かない
name: Deploy (production)

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    name: 本番にデプロイ
    # 確認を経ていないブランチの内容を本番に出さない
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secrets は GitHub の Environment「production」に置く（README 参照）
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    # 本番デプロイは1つずつ順に行う（途中で止めない）
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci --ignore-scripts

      - name: テスト
        run: npm test

      - name: 本番ビルド
        run: npm run build
        env:
          BUILD_MODE: production

      - name: dist の検査（公開日時前の号が含まれていないか）
        run: node scripts/verify-dist.mjs production

      - name: Cloudflare にデプロイ
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
